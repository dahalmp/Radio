<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Radio Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { background: linear-gradient(180deg, #eef1f8, #e6eaf5); }

    .card {
      background: #ffffff !important;
      border: 1px solid #e3e7f2 !important;
      box-shadow: 0 8px 20px -8px rgba(30,41,59,0.12);
    }
    .station-row{ transition: background .15s, border-color .15s; }
    .station-row.active{ border-color:#6366f1 !important; background:#eef0fe !important; }

    @keyframes soundwave {
      0%, 100% { height: 30%; }
      50% { height: 100%; }
    }
    .wave { animation: soundwave 1.2s ease-in-out infinite; }
    .wave:nth-child(2) { animation-delay: 0.2s; }
    .wave:nth-child(3) { animation-delay: 0.4s; }
    .wave:nth-child(4) { animation-delay: 0.1s; }
    .wave:nth-child(5) { animation-delay: 0.3s; }
    .paused-wave { animation-play-state: paused !important; }

    ::-webkit-scrollbar{ width:0; height:0; }
    .fav-on{ color:#f59e0b !important; }
    .live-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
      letter-spacing:1px; color:#94a3b8; }
    .live-badge i{ width:7px; height:7px; border-radius:50%; background:#cbd5e1; display:inline-block; }
    .live-badge.on i{ background:#10b981; box-shadow:0 0 8px #10b981; animation:blink 1.3s infinite; }
    @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.3} }

    .expand-panel{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
    .expand-panel.open{ max-height:600px; }
  </style>
</head>
<body class="min-h-screen px-4 py-6 text-slate-800">

  <div class="w-full max-w-md mx-auto space-y-5 px-2 sm:px-0">

    <div class="text-center mb-1">
      <h1 class="text-2xl font-bold text-slate-800">तरंग <span class="text-indigo-600">Radio</span></h1>
      <p class="text-slate-500 text-xs mt-1">कुनै स्टेसन छान्नुहोस् र सुन्न सुरु गर्नुहोस्</p>
    </div>

    <!-- ===================== STATION LIST ===================== -->
    <div class="card rounded-3xl p-5">
      <div class="flex items-center gap-2 mb-4">
        <i class="fas fa-list-ul text-indigo-500"></i>
        <h3 class="font-bold text-base text-slate-800">रेडियो स्टेसनहरू</h3>
      </div>

      <input type="text" id="searchInput" placeholder="स्टेसन खोज्नुहोस्..."
             class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 outline-none focus:border-indigo-400 mb-4">

      <div id="stationList" class="space-y-2"></div>
      <p id="emptyMsg" class="hidden text-center text-slate-400 text-sm py-6">कुनै स्टेसन फेला परेन।</p>
    </div>

  </div>

  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full text-xs opacity-0 pointer-events-none transition-all z-50"></div>

<script>
  /* ---------------- Stations ---------------- */
  const STATIONS = [
    {id:'d1', name:'BBC World Service', genre:'समाचार · अंग्रेजी', url:'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service', fav:false},
    {id:'d2', name:'SomaFM · Groove Salad', genre:'एम्बियन्ट संगीत', url:'https://ice1.somafm.com/groovesalad-128-mp3', fav:false},
    {id:'d3', name:'SomaFM · Indie Pop Rocks', genre:'इन्डी पप', url:'https://ice1.somafm.com/indiepop-128-mp3', fav:false},
    {id:'d4', name:'Radio Paradise', genre:'ईक्लेक्टिक रक/पप', url:'https://stream.radioparadise.com/mp3-128', fav:false},
    {id:'d5', name:'NPR News', genre:'समाचार', url:'https://npr-ice.streamguys1.com/live.mp3', fav:false},
  ];

  function loadFavs(){
    try{
      const raw = localStorage.getItem('tarang_favs');
      const favs = raw ? JSON.parse(raw) : [];
      STATIONS.forEach(s => s.fav = favs.includes(s.id));
    }catch(e){}
  }
  function saveFavs(){
    localStorage.setItem('tarang_favs', JSON.stringify(STATIONS.filter(s=>s.fav).map(s=>s.id)));
  }

  let expandedId = null;   // which station's player is open
  let playing = false;
  let audioContext, source, destination, isAudioContextSetup = false;
  let mediaRecorder, recordedChunks = [], recordedUrl = null;
  const audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.volume = 0.8;

  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  function renderStations(){
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('stationList');
    const filtered = STATIONS.filter(s => s.name.toLowerCase().includes(q) || (s.genre||'').toLowerCase().includes(q));

    list.innerHTML = filtered.map(s => stationBlockHtml(s)).join('');
    document.getElementById('emptyMsg').classList.toggle('hidden', filtered.length>0);

    bindStationEvents();
    if(expandedId) updatePlayerUI();
  }

  function stationBlockHtml(s){
    const isOpen = s.id === expandedId;
    return `
    <div class="rounded-2xl overflow-hidden border ${isOpen?'border-indigo-300':'border-transparent'}">
      <div class="station-row flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-2xl px-3 py-2.5 cursor-pointer ${isOpen?'active':''}" data-id="${s.id}">
        <div class="w-9 h-9 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-indigo-500 flex-shrink-0">
          <i class="fas ${isOpen && playing ? 'fa-pause' : 'fa-play'} text-xs"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate text-slate-800">${escapeHtml(s.name)}</p>
          <p class="text-[11px] text-slate-500 truncate">${escapeHtml(s.genre||'रेडियो')}</p>
        </div>
        <button data-fav="${s.id}" class="text-lg px-1 ${s.fav?'fav-on':'text-slate-300'}"><i class="fa-star ${s.fav?'fas':'far'}"></i></button>
      </div>

      <div class="expand-panel ${isOpen?'open':''}" id="panel-${s.id}">
        <div class="bg-white border-x border-b border-slate-200 rounded-b-2xl -mt-2 pt-4 px-4 pb-4">
          ${isOpen ? playerHtml(s) : ''}
        </div>
      </div>
    </div>`;
  }

  function playerHtml(s){
    return `
      <div class="w-32 h-32 mx-auto mb-4 bg-indigo-50 rounded-2xl flex items-center justify-center border border-indigo-100">
        <div class="flex items-end gap-2.5 h-14 w-24 justify-center">
          <div class="w-3 bg-indigo-500 rounded-t paused-wave wave"></div>
          <div class="w-3 bg-indigo-500 rounded-t paused-wave wave"></div>
          <div class="w-3 bg-indigo-500 rounded-t paused-wave wave"></div>
          <div class="w-3 bg-indigo-500 rounded-t paused-wave wave"></div>
          <div class="w-3 bg-indigo-500 rounded-t paused-wave wave"></div>
        </div>
      </div>

      <div class="flex flex-col items-center gap-4">
        <button id="playBtn" class="w-16 h-16 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition rounded-full flex flex-col items-center justify-center shadow-lg">
          <i id="playIcon" class="fas fa-play text-lg text-white"></i>
        </button>

        <div class="w-full flex items-center justify-between px-1">
          <span class="live-badge" id="liveBadge"><i></i><span id="liveBadgeText">रोकिएको</span></span>
          <div class="flex items-center gap-2 w-24">
            <i class="fas fa-volume-low text-slate-400 text-xs"></i>
            <input type="range" id="volSlider" min="0" max="100" value="80"
                   class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-500">
          </div>
        </div>
      </div>

      <div class="mt-5 pt-4 border-t border-slate-100">
        <p class="text-xs font-semibold text-slate-500 mb-3 flex items-center gap-2"><i class="fas fa-microphone text-indigo-400"></i> Audio Record</p>
        <div class="grid grid-cols-2 gap-2.5">
          <button id="startBtn" class="py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 transition flex flex-col items-center justify-center font-bold text-white text-xs">
            <i class="fas fa-circle text-sm mb-1"></i> Start
          </button>
          <button id="stopBtn" disabled class="py-3 rounded-xl bg-red-500 hover:bg-red-400 active:scale-95 transition flex flex-col items-center justify-center font-bold text-white text-xs opacity-40 cursor-not-allowed">
            <i class="fas fa-stop text-sm mb-1"></i> Stop
          </button>
        </div>
        <div id="recordingStatus" class="hidden mt-3 text-center text-red-500 font-semibold text-xs animate-pulse">● Recording Live Radio...</div>
        <div id="recordedAudioContainer" class="hidden mt-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <audio id="recordedAudio" controls class="w-full mb-2"></audio>
          <button id="downloadBtn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold text-xs text-white">Download File</button>
        </div>
      </div>
    `;
  }

  function bindStationEvents(){
    document.querySelectorAll('.station-row').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('[data-fav]')) return;
        toggleStation(row.dataset.id);
      });
    });
    document.querySelectorAll('[data-fav]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const s = STATIONS.find(x=>x.id===btn.dataset.fav);
        s.fav = !s.fav; saveFavs(); renderStations();
      });
    });
  }

  /* ---------------- Player logic ---------------- */
  function setupAudioContext() {
    if (isAudioContextSetup) return;
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      source = audioContext.createMediaElementSource(audio);
      destination = audioContext.createMediaStreamDestination();
      source.connect(destination);
      source.connect(audioContext.destination);
      isAudioContextSetup = true;
    } catch (e) { console.error("AudioContext Setup Error:", e); }
  }

  function toggleStation(id){
    if(expandedId === id){
      // collapse + stop
      expandedId = null; playing = false; audio.pause(); audio.src='';
      renderStations();
      return;
    }
    expandedId = id;
    const s = STATIONS.find(x=>x.id===id);
    audio.src = s.url;
    renderStations();
    playAudio();
  }

  function playAudio(){
    setupAudioContext();
    if (audioContext && audioContext.state === 'suspended') audioContext.resume();
    audio.play().then(()=>{ playing = true; updatePlayerUI(); }).catch(()=>{ toast('स्ट्रिम खोल्न सकिएन'); });
  }
  function pauseAudio(){ audio.pause(); playing = false; updatePlayerUI(); }
  function togglePlay(){ if(playing) pauseAudio(); else playAudio(); }

  function updatePlayerUI(){
    if(!expandedId) return;
    const icon = document.getElementById('playIcon');
    const badge = document.getElementById('liveBadge');
    const badgeText = document.getElementById('liveBadgeText');
    if(!icon) return;
    if(playing){
      icon.classList.replace('fa-play','fa-pause');
      document.querySelectorAll('#panel-'+expandedId+' .wave').forEach(w=>w.classList.remove('paused-wave'));
      badge.classList.add('on'); badgeText.textContent='लाइभ';
    } else {
      icon.classList.replace('fa-pause','fa-play');
      document.querySelectorAll('#panel-'+expandedId+' .wave').forEach(w=>w.classList.add('paused-wave'));
      badge.classList.remove('on'); badgeText.textContent='रोकिएको';
    }
    // refresh play/pause icon on the collapsed row too
    const rowIcon = document.querySelector(`.station-row[data-id="${expandedId}"] .fa-play, .station-row[data-id="${expandedId}"] .fa-pause`);
    if(rowIcon){ rowIcon.className = `fas ${playing?'fa-pause':'fa-play'} text-xs`; }

    const playBtn = document.getElementById('playBtn');
    if(playBtn) playBtn.onclick = togglePlay;
    const volSlider = document.getElementById('volSlider');
    if(volSlider){ volSlider.value = audio.volume*100; volSlider.oninput = (e)=> audio.volume = e.target.value/100; }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    if(startBtn) startBtn.onclick = startPlayerRecording;
    if(stopBtn) stopBtn.onclick = stopPlayerRecording;
    const dlBtn = document.getElementById('downloadBtn');
    if(dlBtn) dlBtn.onclick = downloadRecording;
  }

  audio.addEventListener('waiting', ()=>{ const t=document.getElementById('liveBadgeText'); if(t) t.textContent='लोड हुँदै...'; });
  audio.addEventListener('playing', ()=>{ playing=true; updatePlayerUI(); });
  audio.addEventListener('error', ()=>{ toast('स्ट्रिम त्रुटि, अर्को स्टेसन प्रयास गर्नुहोस्'); playing=false; updatePlayerUI(); });

  /* ---------------- Recording ---------------- */
  async function startPlayerRecording() {
    setupAudioContext();
    if (audioContext && audioContext.state === 'suspended') await audioContext.resume();
    if (audio.paused) playAudio();

    try {
      mediaRecorder = new MediaRecorder(destination.stream);
      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/mp3' });
        recordedUrl = URL.createObjectURL(blob);
        const ra = document.getElementById('recordedAudio');
        if(ra){ ra.src = recordedUrl; document.getElementById('recordedAudioContainer').classList.remove('hidden'); }
      };
      mediaRecorder.start();

      document.getElementById('startBtn').disabled = true;
      document.getElementById('startBtn').classList.add('opacity-40');
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('stopBtn').classList.remove('opacity-40', 'cursor-not-allowed');
      document.getElementById('recordingStatus').classList.remove('hidden');
    } catch (err) {
      toast('यो Browser मा रेकर्डिङ सपोर्ट भएन।');
    }
  }
  function stopPlayerRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    if(startBtn){ startBtn.disabled = false; startBtn.classList.remove('opacity-40'); }
    if(stopBtn){ stopBtn.disabled = true; stopBtn.classList.add('opacity-40', 'cursor-not-allowed'); }
    const rs = document.getElementById('recordingStatus');
    if(rs) rs.classList.add('hidden');
  }
  function downloadRecording() {
    if (recordedUrl) {
      const a = document.createElement('a');
      a.href = recordedUrl;
      a.download = `Tarang_Recording_${new Date().getTime()}.mp3`;
      a.click();
    }
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.opacity='1'; t.style.bottom='30px';
    setTimeout(()=>{ t.style.opacity='0'; t.style.bottom='24px'; }, 1800);
  }

  document.getElementById('searchInput').addEventListener('input', renderStations);

  /* ---------------- Init ---------------- */
  loadFavs();
  renderStations();
</script>
</body>
</html>
